# Envoy 設定（design.md §8.5）
# compose profile "proxy" を有効にしたときだけ起動する。
#
# 役割:
#   1. パスルーティング（/auth/* → auth、/graphql → router）
#   2. ログインの IP 単位レート制限（ブルートフォース対策）
#   3. 401 レスポンスボディの正規化（失敗理由を区別させない / design.md §6.8-#9）

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: edge
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                # エッジなので、接続元のアドレスをそのままクライアントの IP とみなす。
                # false だと X-Forwarded-For の値を信じるため、ヘッダを毎回変えるだけで
                # IP 単位のレート制限をすり抜けられる。
                use_remote_address: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

                # 認証失敗の理由をクライアントに区別させない（design.md §6.8-#9）。
                # Router や auth のエラー文言に依存せず、エッジで一律に潰す。
                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value: { default_value: 401, runtime_key: unused }
                      body:
                        inline_string: '{"error":"unauthenticated"}'
                      headers_to_add:
                        - header: { key: "content-type", value: "application/json" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD

                route_config:
                  name: edge_routes
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        # ログイン / サインアップ: レート制限あり
                        - match: { path: "/auth/login" }
                          route:
                            cluster: auth
                            # 送信元 IP ごとの記述子を作り、下の descriptors と突き合わせる
                            rate_limits:
                              - actions: [{ remote_address: {} }]
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: auth_login
                              # 記述子に一致しなかった場合だけ使う、全クライアント共有の上限。
                              # 通常は remote_address の記述子が必ず一致するので使われない。
                              token_bucket:
                                max_tokens: 1000
                                tokens_per_fill: 1000
                                fill_interval: 60s
                              always_consume_default_token_bucket: false
                              # value を省いた記述子は「値ごとに別のバケット」になる。
                              # これで IP ごとに 5 req/min になる（全員で 1 つのバケットを共有しない）。
                              descriptors:
                                - entries: [{ key: remote_address }]
                                  token_bucket:
                                    max_tokens: 5
                                    tokens_per_fill: 5
                                    fill_interval: 60s
                              max_dynamic_descriptors: 10000
                              filter_enabled:
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                default_value: { numerator: 100, denominator: HUNDRED }
                        - match: { path: "/auth/signup" }
                          route:
                            cluster: auth
                            # 送信元 IP ごとの記述子を作り、下の descriptors と突き合わせる
                            rate_limits:
                              - actions: [{ remote_address: {} }]
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: auth_signup
                              # 記述子に一致しなかった場合だけ使う、全クライアント共有の上限。
                              # 通常は remote_address の記述子が必ず一致するので使われない。
                              token_bucket:
                                max_tokens: 1000
                                tokens_per_fill: 1000
                                fill_interval: 60s
                              always_consume_default_token_bucket: false
                              # value を省いた記述子は「値ごとに別のバケット」になる。
                              # これで IP ごとに 5 req/min になる（全員で 1 つのバケットを共有しない）。
                              descriptors:
                                - entries: [{ key: remote_address }]
                                  token_bucket:
                                    max_tokens: 5
                                    tokens_per_fill: 5
                                    fill_interval: 60s
                              max_dynamic_descriptors: 10000
                              filter_enabled:
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                default_value: { numerator: 100, denominator: HUNDRED }

                        # JWKS: 公開鍵の配信。レート制限なし
                        - match: { prefix: "/.well-known/" }
                          route: { cluster: auth }

                        # GraphQL
                        - match: { prefix: "/graphql" }
                          route: { cluster: router }

                        # Web フロントエンド。web は auth を内部ネットワークで直接呼ぶため、
                        # /auth/login のレート制限が効かない。画面側の POST にも同じ制限をかける。
                        - match: { path: "/login", headers: [{ name: ":method", string_match: { exact: "POST" } }] }
                          route:
                            cluster: web
                            # 送信元 IP ごとの記述子を作り、下の descriptors と突き合わせる
                            rate_limits:
                              - actions: [{ remote_address: {} }]
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: web_login
                              # 記述子に一致しなかった場合だけ使う、全クライアント共有の上限。
                              # 通常は remote_address の記述子が必ず一致するので使われない。
                              token_bucket:
                                max_tokens: 1000
                                tokens_per_fill: 1000
                                fill_interval: 60s
                              always_consume_default_token_bucket: false
                              # value を省いた記述子は「値ごとに別のバケット」になる。
                              # これで IP ごとに 5 req/min になる（全員で 1 つのバケットを共有しない）。
                              descriptors:
                                - entries: [{ key: remote_address }]
                                  token_bucket:
                                    max_tokens: 5
                                    tokens_per_fill: 5
                                    fill_interval: 60s
                              max_dynamic_descriptors: 10000
                              filter_enabled:
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                default_value: { numerator: 100, denominator: HUNDRED }
                        - match: { path: "/signup", headers: [{ name: ":method", string_match: { exact: "POST" } }] }
                          route:
                            cluster: web
                            # 送信元 IP ごとの記述子を作り、下の descriptors と突き合わせる
                            rate_limits:
                              - actions: [{ remote_address: {} }]
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: web_signup
                              # 記述子に一致しなかった場合だけ使う、全クライアント共有の上限。
                              # 通常は remote_address の記述子が必ず一致するので使われない。
                              token_bucket:
                                max_tokens: 1000
                                tokens_per_fill: 1000
                                fill_interval: 60s
                              always_consume_default_token_bucket: false
                              # value を省いた記述子は「値ごとに別のバケット」になる。
                              # これで IP ごとに 5 req/min になる（全員で 1 つのバケットを共有しない）。
                              descriptors:
                                - entries: [{ key: remote_address }]
                                  token_bucket:
                                    max_tokens: 5
                                    tokens_per_fill: 5
                                    fill_interval: 60s
                              max_dynamic_descriptors: 10000
                              filter_enabled:
                                default_value: { numerator: 100, denominator: HUNDRED }
                              filter_enforced:
                                default_value: { numerator: 100, denominator: HUNDRED }
                        - match: { prefix: "/" }
                          route: { cluster: web }

                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: edge_ratelimit
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: auth
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: auth, port_value: 8083 }

    - name: router
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: router
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: router, port_value: 3002 }

    - name: web
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: web
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: web, port_value: 8084 }
