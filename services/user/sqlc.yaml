version: "2"
sql:
  - engine: "postgresql"
    schema: "../../db/user/migrations"
    queries: "../../db/user/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
