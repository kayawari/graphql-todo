schema:
  - graph/*.graphqls

exec:
  filename: graph/generated/generated.go
  package: generated

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

federation:
  # gqlgen は federation と exec が同じパッケージであることを要求するため、
  # design.md §7 の記載（graph/federation.go）から generated 配下へ変更した。
  filename: graph/generated/federation.go
  package: generated
  version: 2

directives:
  # @authenticated は Router が解釈するスキーマレベルのディレクティブ。
  # サブグラフ側に実行時の実装は不要なので skip_runtime にする。
  authenticated:
    skip_runtime: true

models:
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
